name: Connect Vibely launch modules

on:
  push:
    branches: [main]
    paths:
      - 'share-vibe.js'
      - 'trending.js'
      - 'business-interest.js'
      - 'vibely-launch.js'
      - 'ask-vibely-ui.js'
      - 'ask-vibely-view-fix.js'
      - 'desktop-nav.js'
      - '.github/workflows/connect-launch-modules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Attach launch modules to the existing app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="/vibely-launch.js"></script>',
              '<script src="/ask-vibely-ui.js"></script>'
          ]
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Could not find </body> in index.html')
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Launch modules attached.')
          else:
              print('Launch modules already attached.')
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "fix: ensure Ask Vibely loads directly"
            git push
          fi
