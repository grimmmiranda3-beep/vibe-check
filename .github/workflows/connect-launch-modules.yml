name: Connect Vibely launch modules

on:
  push:
    branches: [main]
    paths:
      - 'share-vibe.js'
      - 'trending.js'
      - 'business-interest.js'
      - 'vibely-launch.js'
      - '.github/workflows/connect-launch-modules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Attach launch modules to the existing app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/vibely-launch.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Could not find </body> in index.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Launch modules attached.')
          else:
              print('Launch modules already attached.')
          PY
      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: connect launch modules"
            git push
          fi
