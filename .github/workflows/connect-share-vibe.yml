name: Connect Share Vibe

on:
  push:
    branches: [main]
    paths:
      - 'share-vibe.js'
      - 'index.html'
      - '.github/workflows/connect-share-vibe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect-share-vibe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add Share Vibe script tag if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/share-vibe.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
              print('Share Vibe connected.')
          else:
              print('Share Vibe already connected.')
          PY

      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: connect Share Vibe to app"
            git push
          fi
