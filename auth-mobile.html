<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening Vibe Check…</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f6f9;color:#17151a;display:grid;place-items:center;min-height:100vh}
.card{width:min(92vw,440px);background:#fff;border:1px solid #ece8ee;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 48px rgba(25,18,35,.08)}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:26px;font-weight:900}
h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#77727b;line-height:1.5}.button{display:inline-block;margin-top:18px;background:#17151a;color:#fff;padding:12px 16px;border-radius:14px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="card">
<div class="logo">✦</div>
<h1>Opening Vibe Check…</h1>
<p>Your sign-in is complete. We’re sending you back to the app.</p>
<a id="openApp" class="button" href="#">Open Vibe Check</a>
</div>
<script>
(function(){
  var query=location.search||'';
  var hash=location.hash||'';
  var target='vibelycheck://auth-callback'+query+hash;
  var button=document.getElementById('openApp');
  button.href=target;
  setTimeout(function(){ location.href=target; },150);
})();
</script>
</body>
</html>
