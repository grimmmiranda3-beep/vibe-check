<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Feed — Vibe Check</title><style>:root{--ink:#17151a;--muted:#77727b;--line:#ece8ee;--bg:#f8f6f9;--a:#7c3aed;--b:#ec4899}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}.wrap{max-width:820px;margin:auto;padding:38px 18px 70px}.eyebrow{color:var(--a);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:42px;line-height:1.05;margin:7px 0}.hero p{color:var(--muted);line-height:1.5}.feed{display:grid;gap:12px;margin-top:24px}.item{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:13px;align-items:center;box-shadow:0 6px 24px #21142c08}.vibe{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#f7f1ff,#fff0f8);display:grid;place-items:center;font-size:27px}.main{min-width:0;flex:1}.place{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.time{font-size:11px;color:var(--a);font-weight:850;white-space:nowrap}.empty,.loading{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}.privacy{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}@media(max-width:600px){.hero h1{font-size:34px}.time{display:none}}</style></head><body><header class="top"><div class="brand"><div class="logo">✦</div>Vibe Check</div><button class="back" onclick="location.href='/'">← Explore</button></header><main class="wrap"><section class="hero"><div class="eyebrow">Live community pulse</div><h1>What’s the vibe right now?</h1><p>Recent anonymous check-ins from the last 3 hours. No names. No profiles. Just the local energy.</p></section><section class="feed" id="feed"><div class="loading">Loading the live vibe…</div></section><div class="privacy">🔒 Check-ins are anonymous to the community and expire after 3 hours.</div></main><script>const words={'😍':'Loved','😊':'Chill','🔥':'Energetic','😌':'Relaxed','🥳':'Party'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function ago(d){const m=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000));if(m<1)return'just now';if(m<60)return`${m}m ago`;return`${Math.floor(m/60)}h ago`}async function load(){try{const r=await fetch('/api/feed?limit=40',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);const items=d.feed||[];if(!items.length){feed.innerHTML='<div class="empty">No recent check-ins yet. Be the first to set the vibe.</div>';return}feed.innerHTML=items.map(x=>`<article class="item"><div class="vibe">${esc(x.vibe||'💜')}</div><div class="main"><div class="place">${esc(x.place_name||'Local place')}</div><div class="meta">${esc(words[x.vibe]||'Vibe')} · ${esc(x.place_address||'Local area')}</div></div><div class="time">${esc(ago(x.created_at))}</div></article>`).join('')}catch(e){feed.innerHTML='<div class="empty">The live feed is taking a moment. Try again shortly.</div>'}}load();setInterval(load,60000);</script></body></html>
