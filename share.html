<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Vibe Check — Share the vibe</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f4f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17151a}.wrap{width:min(430px,100%)}.card{position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(145deg,#7c3aed 0%,#ec4899 100%);padding:30px;color:#fff;box-shadow:0 28px 70px #24112d30}.glow{position:absolute;width:220px;height:220px;border-radius:50%;background:#fff2;filter:blur(4px);right:-90px;top:-80px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px}.logo{width:34px;height:34px;border-radius:12px;background:#fff;color:#7c3aed;display:grid;place-items:center}.eyebrow{margin-top:34px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.8}.name{font-size:32px;line-height:1.05;font-weight:950;margin:8px 0 22px;max-width:340px}.score{display:flex;align-items:end;gap:7px}.score strong{font-size:76px;line-height:.9;letter-spacing:-.06em}.score span{font-size:18px;font-weight:800;padding-bottom:8px}.copy{font-size:15px;line-height:1.45;margin-top:14px;max-width:330px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.stat{background:#ffffff20;border:1px solid #ffffff28;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.cta{display:block;text-align:center;margin-top:28px;background:#fff;color:#17151a;text-decoration:none;font-weight:900;padding:14px;border-radius:15px}.foot{text-align:center;color:#77727b;font-size:12px;margin-top:13px}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="glow"></div><div class="brand"><div class="logo">✦</div>Vibe Check</div><div class="eyebrow">The vibe right now</div><div class="name" id="name">Your next spot</div><div class="score"><strong id="score">9.2</strong><span>/10 🔥</span></div><div class="copy" id="copy">See what people are feeling before you go.</div><div class="stats"><span class="stat" id="sentiment">❤️ Loved</span><span class="stat" id="checks">Anonymous check-ins</span></div><a class="cta" href="https://vibelycheck.com">Check the vibe →</a></div><div class="foot">Know the vibe before you go.</div></div>
<script>
const p=new URLSearchParams(location.search);const text=(k,f)=>p.get(k)||f;document.getElementById('name').textContent=text('name','Your next spot');document.getElementById('score').textContent=text('score','9.2');document.getElementById('sentiment').textContent=text('vibe','❤️ Loved');document.getElementById('checks').textContent=text('checks','Anonymous check-ins');document.getElementById('copy').textContent=text('copy','See what people are feeling before you go.');
</script>
</body>
</html>
